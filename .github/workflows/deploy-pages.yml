# Builds the web app and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build
        env:
          # Set in repo Settings -> Secrets and variables -> Actions -> Variables
          VITE_STORAGE_URL: ${{ vars.VITE_STORAGE_URL }}
        run: |
          if [ -z "$VITE_STORAGE_URL" ]; then echo "::warning::VITE_STORAGE_URL repo variable is not set — file uploads will be disabled"; fi
          # <user>.github.io repos (or a custom domain) serve from "/", project repos from "/<repo>/"
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]] || [[ -n "${{ vars.PAGES_CUSTOM_DOMAIN }}" ]]; then BASE="/"; else BASE="/$REPO/"; fi
          VITE_BASE_PATH="$BASE" npm run build
          # SPA deep links: GitHub Pages serves 404.html for unknown paths
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
