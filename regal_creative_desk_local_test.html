us==='Approved').length/ts.length*100):0;const bar=p=>'<div class="bar"><i style="width:'+p+'%"></i></div>';const tag=s=>'<span class="pill '+(s==='Revisions'?'danger':s==='High'?'warn':'')+'">'+esc(s)+'</span>';function save(msg){localStorage.setItem(KEY,JSON.stringify(data));if(msg){notice=msg;const t=$('#toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}}function notify(to,task,message){data.notifications.unshift({id:Date.now()+Math.random(),to,taskId:task?.id||null,message,time:new Date().toLocaleString(),read:false})}function notifications(){let who=admin()?'Admin':'Designer',ns=data.notifications.filter(n=>n.to===who);return '<div class="flex"><div><h2 class="sectiontitle">Notifications</h2><p class="muted">Submission alerts, correction requests, approvals and new assignments.</p></div><button class="btn tiny secondary" onclick="markAllRead()">Mark all read</button></div><div class="card" style="margin-top:14px">'+(ns.length?ns.map(n=>'<div class="item" style="display:flex;align-items:center;gap:12px;cursor:pointer;background:'+(n.read?'transparent':'#f6f0e8')+'" onclick="openNotification('+n.id+')"><span style="font-size:19px">'+(n.read?'○':'●')+'</span><div style="flex:1"><b>'+esc(n.message)+'</b><div class="muted">'+esc(n.time)+'</div></div><span class="muted">Open →</span></div>').join(''):'<p class="muted">No notifications yet.</p>')+'</div>'}function markAllRead(){data.notifications.filter(n=>n.to===(admin()?'Admin':'Designer')).forEach(n=>n.read=true);save('Notifications marked as read');render()}function openNotification(id){let n=data.notifications.find(n=>n.id===id);if(!n)return;n.read=true;save();if(n.taskId)openTask(n.taskId);else render()}function log(text){data.activity.unshift({id:Date.now()+Math.random(),text,time:new Date().toLocaleString()})}function goto(p){page=p;taskId=null;notice='';render()}const nav=[['dashboard','▦','Dashboard'],['campaigns','▣','Campaigns'],['tasks','☷','Task Tracker'],['tea function dashboard(){let ts=visible(),items=[['Active Campaigns',data.campaigns.length],['Assigned Tasks',ts.length],['In Review',ts.filter(t=>t.status==='In Review').length],['Approved',ts.filter(t=>t.status==='Approved').length]];return '<div class="flex" style="margin-bottom:16px"><div><h2 class="sectiontitle" style="margin:0">Creative operations at a glance</h2><p class="muted">Campaign progress, employee workload and review queue</p></div>'+(admin()?'<button class="btn" onclick="goto(\'newtask\')">+ Assign Work</button>':'<button class="btn" onclick="goto(\'tasks\')">Open My Tasks</button>')+'</div><div class="grid">'+items.map(x=>'<div class="card stat"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="twocol"><div class="card"><div class="flex"><h3 class="sectiontitle">Campaign progress</h3><button class="btn tiny secondary" onclick="goto(\'campaigns\')">All campaigns →</button></div>'+data.campaigns.map(c=>{let ct=ts.filter(t=>t.campaignId===c.id),p=progress(ct);return '<div class="item" style="cursor:pointer" onclick="openCampaign('+c.id+')"><div class="flex"><b>'+esc(c.name)+'</b><span class="muted">'+p+'% · '+ct.length+' tasks</span></div><div style="margin-top:9px">'+bar(p)+'</div></div>'}).join('')+'</div><div class="card"><h3 class="sectiontitle">'+(admin()?'Employee workload':'My workload')+'</h3>'+data.employees.filter(e=>e.role==='Designer'&&(admin()||e.id===1)).map(e=>{let et=ts.filter(t=>t.assignee===e.id),p=progress(et);return '<div class="chartrow"><span>'+esc(e.name)+'</span>'+bar(p)+'<span>'+et.length+'</span></div><div class="muted" style="margin:-6px 0 8px 104px">'+et.filter(t=>t.status==='Approved').length+' approved · '+et.reduce((s,t)=>s+(Number(t.hours)||0),0)+'h logged</div>'}).join('')+'</div></div><div class="twocol"><div class="card"><div class="flex"><h3 class="sectiontitle">Campaigns</h3><button class="btn tiny secondary" onclick="goto(\'campaigns\')">View all →</button></div><div class="campaigns function cover(c){return '<div class="cover" style="background:'+esc(c.color||'#71846d')+'">'+(c.cover?'<img alt="Campaign cover" style="position:absolute;width:100%;height:100%;object-fit:cover" src="'+esc(c.cover)+'">':'<div style="display:grid;gap:5px"><b>'+esc(c.label||'REGAL')+'</b><span>REGAL JEWELLERS</span></div>')+'</div>'}function campaigns(){return '<div class="flex" style="margin-bottom:16px"><div><h2 class="sectiontitle">All campaigns</h2><p class="muted">Open a campaign to see its entire creative workflow.</p></div>'+(admin()?'<button class="btn" onclick="goto(\'newcampaign\')">+ New Campaign</button>':'')+'</div><div class="campaigns">'+data.campaigns.map(c=>{let ts=visible().filter(t=>t.campaignId===c.id),p=progress(ts);return '<div class="card campaigncard" onclick="openCampaign('+c.id+')">'+cover(c)+'<h3 style="font-size:15px;margin:13px 0 6px">'+esc(c.name)+'</h3><p class="muted">'+esc(c.description)+'</p><div class="flex mini"><span>'+ts.length+' tasks</span><b>'+p+'% approved</b></div>'+bar(p)+'<p class="muted">Open campaign →</p></div>'}).join('')+'</div>'}function openCampaign(id){campaignId=id;tab='tasks';page='campaign';render()}function campaignDetail(){let c=campaign(campaignId);if(!c)return '<p>Campaign not found</p>';let ts=visible().filter(t=>t.campaignId===c.id);let tabs=[['tasks','All Tasks'],['brief','Content Brief'],['employees','Employees'],['submissions','Submissions'],['activity','Activity']];let html='<button class="btn secondary tiny" onclick="goto(\'campaigns\')">← Campaigns</button><div class="card detailhead" style="margin-top:13px">'+cover(c)+'<div><span class="pill">Campaign Workspace</span><h2>'+esc(c.name)+'</h2><p class="muted">'+esc(c.description)+'</p><p><b>Key message:</b> '+esc(c.objective)+'</p><div class="flex mini"><span>'+ts.length+' tasks · '+new Set(ts.map(t=>t.assignee)).size+' designers</span><b>'+progress(ts)+'% approved</b></div>'+bar(progress(ts))+'<div class="actions" style="margin-top:12px">'+(admin()?'<button class="btn tiny" onclick="newForCampaign('+c.id+')">+ Assign Campaign Task</button><button class="btn secondary tiny" onclick="document.getElementById(\'coverfile\').click()">Upload Campaign Cover</button><input id="coverfile" type="file" accept="image/*" style="display:none" onchange="loadCover(event,'+c.id+')">':'')+'</div></div></div><div class="tabbar">'+tabs.map(t=>'<button class="'+(tab===t[0]?'active':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</div>';if(tab==='tasks')html+=taskTable(ts);if(tab==='brief')html+='<div class="card"><h3 class="sectiontitle">Campaign Brief</h3><p><b>Objective</b></p><p>'+esc(c.description)+'</p><p><b>Primary copy</b></p><p>'+esc(c.objective)+'</p><p class="muted">Individual tasks contain their own content copy, format and design instructions.</p></div>';if(tab==='employees')html+='<div class="grid">'+data.employees.filter(e=>e.role==='Designer'&&ts.some(t=>t.assignee===e.id)).map(e=>{let et=ts.filter(t=>t.assignee===e.id);return '<div class="card"><b>'+esc(e.name)+'</b><p class="muted">'+et.length+' tasks · '+et.filter(t=>t.status==='Approved').length+' approved</p>'+bar(progress(et))+'<p class="muted">'+et.reduce((a,t)=>a+(Number(t.hours)||0),0)+' hours logged</p></div>'}).join('')+'</div>';if(tab==='submissions')html+=submissionCards(ts.filter(t=>t.submission));if(tab==='activity')html+='<div class="card timeline">'+data.activity.map(a=>'<p>'+esc(a.text)+'<br><span class="muted">'+esc(a.time)+'</span></p>').join('')+'</div>';return html}function setTab(t){tab=t;render()}function newForCampaign(id){campaignId=id;goto('newtask')}
function taskTable(ts){return '<div class="card tablewrap"><table class="tbl"><thead><tr><th>Task</th><th>Designer</th><th>Deadline</th><th>Priority</th><th>Status</th><th></th></tr></thead><tbody>'+ts.map(t=>'<tr><td><b>'+esc(t.title)+'</b><div class="muted">'+esc(campaign(t.campaignId)?.name)+'</div></td><td>'+esc(employee(t.assignee)?.name)+'</td><td>'+esc(t.due)+'</td><td>'+tag(t.priority)+'</td><td>'+tag(t.status)+'</td><td><button class="btn tiny secondary" onclick="openTask('+t.id+')">Open →</button></td></tr>').join('')+'</tbody></table>'+(ts.length?'':'<div class="empty">No tasks found</div>')+'</div>'}function tasks(){let ts=visible().filter(t=>filterCampaign==='all'||t.campaignId===Number(filterCampaign));return '<div class="flex" style="margin-bottom:14px"><select class="filter" onchange="filterCampaign=this.value;render()"><option value="all">All Campaigns</option>'+opts(data.campaigns.map(c=>({value:c.id,label:c.name})),filterCampaign)+'</select>'+(admin()?'<button class="btn" onclick="goto(\'newtask\')">+ Assign New Work</button>':'')+'</div>'+taskTable(ts)}function openTask(id){taskId=id;page='task';render()}
function taskDetail(){let t=data.tasks.find(t=>t.id===taskId);if(!t)return '<p>Task not found</p>';if(!admin()&&t.assignee!==1)return '<p>Not available in designer view.</p>';return '<button class="btn secondary tiny" onclick="goto(\'tasks\')">← Tasks</button><div class="card" style="margin-top:14px"><div class="flex"><div><span class="pill">'+esc(campaign(t.campaignId)?.name)+'</span><h2>'+esc(t.title)+'</h2><p class="muted">Assigned to '+esc(employee(t.assignee)?.name)+' · Deadline '+esc(t.due)+' · '+esc(t.format)+'</p></div>'+tag(t.status)+'</div><div class="twocol"><div><h3 class="sectiontitle">Content Brief</h3><p><b>Approved copy</b></p><p>'+esc(t.copy||'Not specified')+'</p><p><b>Design instructions</b></p><p>'+esc(t.instructions||'Not specified')+'</p><p><b>Priority:</b> '+esc(t.priority)+'</p></div><div><h3 class="sectiontitle">Progress & Submission</h3><form id="taskform" class="fields"><label class="field">Status<select name="status">'+opts(statuses,t.status)+'</select></label><label class="field">Hours worked<input type="number" min="0" step="0.5" name="hours" value="'+(Number(t.hours)||0)+'"></label><label class="field">Submission title<input name="submission" value="'+esc(t.submission)+'" placeholder="e.g. WRP Story v2"></label><label class="field">Design file (image, local demo)<input type="file" name="file" accept="image/*"></label>'+(t.file?'<img class="uploadpreview" src="'+esc(t.file)+'" alt="Submitted design">':'')+(admin()?'<label class="field">Admin feedback<textarea name="feedback">'+esc(t.feedback||'')+'</textarea></label>':'<p class="muted">Admin feedback: '+esc(t.feedback||'No feedback yet')+'</p>')+'<button class="btn" type="submit">Save Task Update</button></form></div></div>'+annotationPanel(t)+'</div>'}function annotationPanel(t){let anns=t.annotations||[];return '<div class="card" style="margin-top:18px;background:#fcfbf9"><div class="flex"><div><h3 class="sectiontitle" style="margin:0">Artwork Corrections</h3><p class="muted">Admin: click directly on the uploaded design to place a numbered correction pin. Designer: open each pin and mark it resolved after editing.</p></div><span class="pill">'+anns.filter(a=>!a.resolved).length+' open comments</span></div>'+(t.file?'<div class="annotation-toolbar"><span class="pill">'+(admin()?'✎ Click artwork to add correction':'◉ Click pins to read feedback')+'</span><span class="muted">Pin positions are saved relative to the image.</span></div><div class="annotation-stage" id="annotation-stage" tabindex="0" role="img" aria-label="Submitted artwork with correction pins" onclick="placePin(event,'+t.id+')"><img src="'+esc(t.file)+'" alt="Design submitted for review">'+anns.map((a,i)=>'<button type="button" class="annotation-pin '+(a.resolved?'resolved':'')+'" style="left:'+a.x+'%;top:'+a.y+'%" onclick="event.stopPropagation();focusPin('+a.id+')" title="Correction '+(i+1)+': '+esc(a.text)+'">'+(i+1)+'</button>').join('')+'</div>':'<div class="hint">Upload a design image in Progress & Submission, save the task, then return here to add image-specific corrections.</div>')+'<div style="margin-top:16px"><b class="mini">Correction thread</b>'+(anns.length?anns.map((a,i)=>'<div class="annotation-comment '+(a.resolved?'resolved':'')+'" id="annotation-'+a.id+'"><div class="flex"><b>Pin '+(i+1)+' · '+(a.resolved?'Resolved':'Correction requested')+'</b><span class="muted">'+esc(a.author)+'</span></div><p style="white-space:pre-wrap;margin:7px 0">'+esc(a.text)+'</p><small>'+esc(a.time)+'</small><div class="actions">'+(!a.resolved&&!admin()?'<button class="btn tiny" onclick="resolvePin('+t.id+','+a.id+')">Mark corrected ✓</button>':'')+(a.resolved?'<span class="pill">✓ Resolved</span>':'')+'</div></div>').join(''):'<p class="muted">No pinned corrections yet.</p>')+'</div></div>'}
function placePin(event,id){if(!admin())return;let stage=document.getElementById('annotation-stage');if(!stage||event.target.closest('.annotation-pin'))return;let rect=stage.getBoundingClientRect();let x=Math.round((event.clientX-rect.left)/rect.width*1000)/10,y=Math.round((event.clientY-rect.top)/rect.height*1000)/10;let message=prompt('Write the correction for this marked area:');if(!message||!message.trim())return;let t=data.tasks.find(t=>t.id===id);if(!t)return;t.annotations=t.annotations||[];t.annotations.push({id:Date.now(),x:Math.max(0,Math.min(100,x)),y:Math.max(0,Math.min(100,y)),text:message.trim(),author:'Admin',time:new Date().toLocaleString(),resolved:false});t.status='Revisions';notify('Designer',t,'New pinned correction on '+t.title+': '+message.trim());log('Admin added an artwork correction to '+t.title);save('Pinned correction sent to designer');render()}
function focusPin(id){let el=document.getElementById('annotation-'+id);el?.scrollIntoView({behavior:'smooth',block:'center'});if(el){el.style.outline='2px solid #b19a72';setTimeout(()=>el.style.outline='',1600)}}
function resolvePin(task,annotation){if(admin())return;let t=data.tasks.find(t=>t.id===task),a=t?.annotations?.find(a=>a.id===annotation);if(!a)return;a.resolved=true;notify('Admin',t,employee(t.assignee)?.name+' marked artwork correction resolved on '+t.title);log('Artwork correction resolved: '+t.title);save('Correction marked resolved');render()}
function newTask(){if(!admin())return '<p>Only admins can assign work.</p>';return '<div class="card"><h2 class="sectiontitle">Assign New Work</h2><p class="muted">Include the full content brief so the designer knows exactly what to create.</p><form id="newtaskform" class="fields"><div class="fields" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px"><label class="field">Task title<input name="title" required placeholder="Instagram Story"></label><label class="field">Campaign<select name="campaignId">'+opts(data.campaigns.map(c=>({value:c.id,label:c.name})),campaignId)+'</select></label><label class="field">Assign Designer<select name="assignee">'+selectEmployees(1)+'</select></label><label class="field">Deadline<input name="due" type="date" value="2026-10-30" required></label><label class="field">Priority<select name="priority">'+opts(['High','Medium','Low'],'Medium')+'</select></label><label class="field">Format / Dimensions<input name="format" placeholder="1080 × 1920" required></label></div><label class="field">Content / Exact Copy<textarea name="copy" placeholder="Headline, supporting copy and CTA"></textarea></label><label class="field">Design Instructions<textarea name="instructions" placeholder="Colours, layout, product reference, mandatory elements"></textarea></label><button class="btn" type="submit">Create & Assign Task</button></form></div>'}function newCampaign(){if(!admin())return '<p>Admin only.</p>';return '<div class="card"><h2 class="sectiontitle">Create Campaign</h2><form id="newcampaignform" class="fields"><div class="fields" style="grid-template-columns:1fr 1fr;gap:12px"><label class="field">Campaign name<input name="name" required></label><label class="field">Cover label<input name="label" placeholder="e.g. WRP"></label><label class="field">Theme colour<input name="color" type="color" value="#71846d"></label><label class="field">Campaign owner<select name="owner">'+selectEmployees(5,true)+'</select></label></div><label class="field">Description<textarea name="description"></textarea></label><label class="field">Main campaign copy<input name="objective"></label><button class="btn" type="submit">Create Campaign</button></form></div>'}function team(){return '<div class="flex" style="margin-bottom:14px"><div><h2 class="sectiontitle">Manage Employees & Roles</h2><p class="muted">Demo role selection. In production, only authorized admins can change roles.</p></div></div><div class="card"><h3 class="sectiontitle">Add Employee</h3><form id="employeeform" class="fields"><div class="fields" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px"><label class="field">Full name<input name="name" required></label><label class="field">Email<input name="email" type="email" required></label><label class="field">Role<select name="role"><option>Designer</option><option>Admin</option></select></label></div><button class="btn" type="submit">+ Add Employee</button></form></div><div class="card tablewrap" style="margin-top:14px"><table class="tbl"><thead><tr><th>Employee</th><th>Email</th><th>Assigned</th><th>Approved</th><th>Hours</th><th>Role</th></tr></thead><tbody>'+data.employees.map(e=>{let ts=data.tasks.filter(t=>t.assignee===e.id);return '<tr><td><b>'+esc(e.name)+'</b></td><td>'+esc(e.email)+'</td><td>'+ts.length+'</td><td>'+ts.filter(t=>t.status==='Approved').length+'</td><td>'+ts.reduce((a,t)=>a+(Number(t.hours)||0),0)+'</td><td><select onchange="changeRole('+e.id+',this.value)">'+opts(['Admin','Designer'],e.role)+'</select></td></tr>'}).join('')+'</tbody></table></div>'}function approvals(){let ts=visible().filter(t=>t.submission||t.status==='In Review');return '<h2 class="sectiontitle">Design Submissions & Approvals</h2>'+submissionCards(ts)}function submissionCards(ts){return ts.length?'<div class="campaigns">'+ts.map(t=>'<div class="card"><div class="art">'+(t.file?'<img src="'+esc(t.file)+'" alt="Design submission">':esc(t.submission||'AWAITING DESIGN'))+'</div><h3 style="font-size:14px">'+esc(t.title)+'</h3><p class="muted">'+esc(employee(t.assignee)?.name)+' · '+esc(campaign(t.campaignId)?.name)+'</p><div class="flex">'+tag(t.status)+'<button class="btn tiny secondary" onclick="openTask('+t.id+')">Review →</button></div>'+(admin()&&t.status==='In Review'?'<div class="actions" style="margin-top:12px"><button class="btn tiny" onclick="review('+t.id+',\'Approved\')">Approve</button><button class="btn tiny secondary" onclick="review('+t.id+',\'Revisions\')">Request Revisions</button></div>':'')+'</div>').join('')+'</div>':'<div class="card empty">No submissions available yet.</div>'}function review(id,status){let t=data.tasks.find(t=>t.id===id);if(!admin()||!t)return;t.status=status;notify('Designer',t,status==='Revisions'?'Admin requested corrections: '+t.title+' · '+t.feedback:'Admin approved: '+t.title);log(t.title+' marked '+status);save('Task marked '+status);render()}function reports(){return '<h2 class="sectiontitle">Employee Workload & Performance</h2><div class="card tablewrap"><table class="tbl"><thead><tr><th>Designer</th><th>Assigned</th><th>In Progress</th><th>In Review</th><th>Approved</th><th>Hours Logged</th><th>Completion</th></tr></thead><tbody>'+data.employees.filter(e=>e.role==='Designer').map(e=>{let ts=data.tasks.filter(t=>t.assignee===e.id);return '<tr><td><b>'+esc(e.name)+'</b></td><td>'+ts.length+'</td><td>'+ts.filter(t=>t.status==='In Progress').length+'</td><td>'+ts.filter(t=>t.status==='In Review').length+'</td><td>'+ts.filter(t=>t.status==='Approved').length+'</td><td>'+ts.reduce((a,t)=>a+(Number(t.hours)||0),0)+' h</td><td>'+progress(ts)+'%</td></tr>'}).join('')+'</tbody></table></div><div class="hint">Logged hours are manually entered by the designer/admin in this demo. They are not automatically measured or independently verified.</div>'}function changeRole(id,role){let e=employee(id);if(!e)return;if(e.role==='Admin'&&role!=='Admin'&&data.employees.filter(x=>x.role==='Admin').length<=1){alert('Keep at least one admin account.');render();return}e.role=role;log(e.name+' role changed to '+role);save('Role updated');render()}function loadCover(ev,id){let f=ev.target.files?.[0];if(!f)return;if(f.size>650000){alert('Use an image smaller than 650 KB for this local demo.');return}let r=new FileReader();r.onload=()=>{campaign(id).cover=r.result;save('Campaign cover updated');render()};r.readAsDataURL(f)}
document.addEventListener('submit',e=>{if(e.target.id==='employeeform'){e.preventDefault();let d=new FormData(e.target),email=String(d.get('email')).trim();if(data.employees.some(x=>x.email.toLowerCase()===email.toLowerCase()))return alert('Email already exists.');let x={id:Date.now(),name:String(d.get('name')).trim(),email,role:String(d.get('role'))};data.employees.push(x);log('Employee '+x.name+' added as '+x.role);save('Employee added');render()}if(e.target.id==='newcampaignform'){e.preventDefault();let d=new FormData(e.target),id=Date.now();data.campaigns.push({id,name:String(d.get('name')),label:String(d.get('label')||'REGAL'),color:String(d.get('color')),description:String(d.get('description')),objective:String(d.get('objective')),owner:Number(d.get('owner')),cover:''});log('Campaign '+d.get('name')+' created');save('Campaign created');openCampaign(id)}if(e.target.id==='newtaskform'){e.preventDefault();let d=new FormData(e.target),t={id:Date.now(),campaignId:Number(d.get('campaignId')),title:String(d.get('title')),assignee:Number(d.get('assignee')),priority:String(d.get('priority')),due:String(d.get('due')),status:'To Do',copy:String(d.get('copy')),instructions:String(d.get('instructions')),format:String(d.get('format')),submission:'',file:'',feedback:'',hours:0};data.tasks.unshift(t);log(t.title+' assigned to '+employee(t.assignee)?.name);notify('Designer',t,'New task assigned: '+t.title+' · due '+t.due);save('Task assigned');openTask(t.id)}if(e.target.id==='taskform'){e.preventDefault();let d=new FormData(e.target),t=data.tasks.find(x=>x.id===taskId);if(!t)return;let oldStatus=t.status,oldFeedback=t.feedback;let file=e.target.querySelector('input[type=file]').files?.[0];const finish=()=>{t.status=String(d.get('status'));t.hours=Number(d.get('hours'))||0;t.submission=String(d.get('submission'));if(admin())t.feedback=String(d.get('feedback'));if(!admin()&&t.status==='In Review'&&oldStatus!=='In Review')notify('Admin',t,employee(t.assignee)?.name+' submitted '+t.title+' for review');if(admin()&&t.status==='Revisions'&&(oldStatus!=='Revisions'||oldFeedback!==t.feedback))notify('Designer',t,'Corrections requested on '+t.title+': '+t.feedback);if(admin()&&t.status==='Approved'&&oldStatus!=='Approved')notify('Designer',t,'Your design was approved: '+t.title);log(t.title+' updated to '+t.status);try{save('Task saved')}catch{alert('Browser storage is full. Use a smaller image.')}render()};if(file){if(file.size>650000)return alert('Use an image smaller than 650 KB for this local demo.');let r=new FileReader();r.onload=()=>{t.file=r.result;finish()};r.readAsDataURL(file)}else finish()}});$('#view').addEventListener('change',()=>goto('dashboard'));window.resetDemo=()=>{if(confirm('Reset all testing changes?')){data=initial();data.notifications=[];localStorage.setItem(KEY,JSON.stringify(data));goto('dashboard')}};render();
</script></body></html>
